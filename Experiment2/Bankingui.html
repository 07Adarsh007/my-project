<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Bank UI</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="card">
        <h2>Account Balance</h2>
        <div class="balance" id="balance">$0</div>

        <div class="transaction">
            <input type="number" id="amount" placeholder="Enter amount" min="1">
        </div>

        <div class="actions">
            <button class="btn deposit-btn" id="depositBtn">Deposit</button>
            <button class="btn withdraw-btn" id="withdrawBtn">Withdraw</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
